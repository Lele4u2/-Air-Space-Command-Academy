<style>

main{max-width:1100px;margin:auto;padding:8px 16px 60px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}

/* Air & Space Academy visual upgrade — aircraft imagery with accessible fallbacks */
:root{--bg:#080f1a;--panel:#111d2d;--line:#2a4158;--acc:#59d8f6;--tx:#edf5ff;--mut:#adbbca}
body{background:radial-gradient(ellipse at 85% -10%,rgba(40,105,146,.28),transparent 46%),linear-gradient(145deg,#07101b,#0b1523 60%,#08101b);min-height:100vh}
header{max-width:1250px;padding:30px 24px 15px}header h1{font-size:clamp(2.2rem,4vw,4.1rem);letter-spacing:.045em;text-transform:uppercase}header p{font-size:1.05rem}
nav,main{max-width:1250px}nav{gap:8px;padding:0 24px;margin-bottom:12px}nav button{border-radius:999px;padding:9px 15px}main{padding:18px 24px 100px}
.card{border-radius:15px;padding:18px;background:linear-gradient(145deg,rgba(24,42,61,.98),rgba(15,28,44,.98));box-shadow:0 10px 30px #0002}
button{transition:transform .16s,border-color .15s,background .15s}button:hover:not(:disabled){transform:translateY(-2px)}
.aircraft-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:17px;margin:18px 0}
.aircraft-card{padding:0;overflow:hidden;display:flex;flex-direction:column;min-height:385px;transition:transform .2s,box-shadow .2s}
.aircraft-card:hover{transform:translateY(-4px);box-shadow:0 20px 44px #0006}
.aircraft-photo{width:100%;height:175px;object-fit:cover;display:block;background:linear-gradient(145deg,#253951,#07101d)}
.aircraft-photo[hidden]{display:none}
.photo-wrap{position:relative;height:175px;overflow:hidden;background:radial-gradient(circle at 70% 10%,#345c7d,#0d1a2a 68%)}
.photo-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#d1e8fa}
.photo-fallback .silhouette{font-size:4.8rem;line-height:1;filter:drop-shadow(0 10px 16px #0008)}
.photo-wrap.has-image .photo-fallback{display:none}
.photo-credit{position:absolute;bottom:7px;right:9px;background:#0009;color:white;padding:2px 6px;border-radius:5px;font-size:.65rem}
.ac-body{padding:15px 16px;flex:1;display:flex;flex-direction:column;gap:6px}.ac-body h3{font-size:1.45rem;margin:0}
.ac-body p{margin:3px 0;font-size:.92rem}.ac-actions{margin-top:auto;padding-top:8px}
.pro-con{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:7px 0}.pro-con div{padding:9px;border:1px solid var(--line);border-radius:9px;font-size:.82rem;line-height:1.35}.pro-con .positive{background:#14382855}.pro-con .negative{background:#462b2355}
.ac-role{color:var(--acc);font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.ac-hero{padding:27px;border:1px solid #335673;border-radius:19px;background:linear-gradient(112deg,#162c43,#0c1728 75%);display:grid;grid-template-columns:1.5fr 1fr;gap:15px;align-items:center;margin-bottom:21px;overflow:hidden}
.ac-hero h2{font-size:clamp(1.9rem,4vw,3.2rem);margin:4px 0}.ac-hero p{color:#b4d0e4}.ac-hero-art{font-size:8rem;text-align:center;transform:rotate(-15deg);text-shadow:0 20px 40px #0009}
.mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:10px 0 20px}
.mini-grid button{padding:12px;text-align:left;border-radius:12px}.mini-grid .photo-wrap{height:105px;border-radius:8px;margin-bottom:9px}.mini-grid .photo-fallback .silhouette{font-size:3rem}
.glass-modal{position:fixed;inset:0;background:#02080dcc;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(8px)}
.glass-modal .modal-panel{width:min(720px,100%);max-height:94vh;overflow:auto;border:1px solid #46748f;border-radius:20px;background:#122236;box-shadow:0 40px 100px #000c;padding:22px}
.glass-modal .photo-wrap{height:260px;border-radius:13px;margin:10px 0 15px}
.glass-modal .photo-fallback .silhouette{font-size:6rem}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.toast-area{position:fixed;bottom:20px;right:20px;z-index:120;max-width:min(420px,90vw);pointer-events:none}.game-toast{background:#193a4b;border:1px solid #59d8f6;border-radius:13px;padding:13px 16px;margin-top:8px;box-shadow:0 16px 36px #0008;animation:toastin .24s ease both}
@keyframes toastin{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.stage-panel{padding:13px;border:1px solid #315371;border-radius:12px;background:#0b2031;margin:12px 0}
.stage-panel h3{margin-bottom:6px}.tag{border-color:#3e5a74}
.game-flag{background:linear-gradient(100deg,#204b66,#0e253b);padding:12px;border-radius:10px;margin:14px 0}
@media(max-width:700px){.ac-hero{grid-template-columns:1fr}.ac-hero-art{display:none}main{padding:12px 13px 70px}.pro-con{grid-template-columns:1fr}.aircraft-grid{grid-template-columns:1fr}header{padding:20px 14px 12px}}
@media(prefers-reduced-motion:reduce){.aircraft-card,.game-toast,button{animation:none;transition:none!important}}

/* Animated logistics flight deck: aircraft positions reflect the turn-based rules state. */
.flight-deck{margin:15px 0 21px;border:1px solid #37617e;background:radial-gradient(ellipse at 55% 28%,#17374b,#071725 72%);border-radius:20px;padding:15px;overflow:hidden}
.flight-deck h3{font-size:1.7em}.flight-deck-header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center}
.flight-stage{position:relative;min-height:305px;border-radius:14px;background:repeating-linear-gradient(0deg,transparent,transparent 36px,#ffffff07 37px),repeating-linear-gradient(90deg,transparent,transparent 36px,#ffffff07 37px),linear-gradient(125deg,#12334b,#081521);border:1px solid #31556c;overflow:hidden}
.flight-route{position:absolute;left:16%;top:52%;width:69%;height:2px;background:repeating-linear-gradient(90deg,#76d9ee 0,#76d9ee 11px,transparent 11px,transparent 21px);transform:rotate(-12deg);opacity:.53;transform-origin:left}
.airbase-node{position:absolute;left:3%;bottom:9%;width:26%;max-width:155px;text-align:center;border:1px solid #37839a;border-radius:13px;background:#082939e8;padding:9px;color:#e7f4ff}
.airbase-node.destination{left:auto;right:3%;top:8%;bottom:auto;border-color:#ddbb68;background:#423820df}
.airbase-node strong{display:block;font-size:.9em}.airbase-node small{display:block;font-size:.7em}
.flight-token{position:absolute;width:72px;height:59px;border:1px solid #4f9bb7;border-radius:13px;color:#e7fbff;background:#143447e8;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transform:translate(-50%,-50%);transition:box-shadow .2s,border-color .2s;z-index:2}
.flight-token:hover,.flight-token:focus-visible{box-shadow:0 0 0 3px #55d0e788;border-color:#8eebf7}.flight-token.selected{border:2px solid #f8d374;box-shadow:0 0 22px #f8d37477}
.flight-token .jet{font-size:1.8rem;line-height:1;display:block;filter:drop-shadow(0 3px 4px #0009)}.flight-token small{font-weight:700;font-size:.69rem}
.flight-token.outbound{animation:flyout 3.2s ease-in-out both;border-color:#6acb86}.flight-token.returning{animation:flyback 2.4s ease-in-out both;border-color:#f1cb71}
@keyframes flyout{from{left:19%;top:71%}to{left:78%;top:34%}}
@keyframes flyback{from{left:78%;top:34%}to{left:19%;top:71%}}
@media(prefers-reduced-motion:reduce){.flight-token.outbound,.flight-token.returning,.rm .flight-token{animation:none!important}}
.flight-detail{border:1px solid #395a72;border-radius:12px;padding:14px;background:#10283b;margin-top:12px}
.flight-detail button{margin-right:7px;margin-bottom:7px}.flight-hint{margin:8px 0;color:#b7cfdf;font-size:.89em}
.flight-status{font-size:.82em;color:#bce9f2}
@media(max-width:650px){.flight-stage{min-height:265px}.airbase-node{font-size:.7em;width:31%}.flight-token{width:56px;height:51px}.flight-token .jet{font-size:1.35rem}.flight-token small{font-size:.6rem}}

/* Mission Arcade 2.0 — compact, rule-driven learning mini-campaign */
.arcade-hero{background:radial-gradient(circle at 80% 25%,#235878,#101e35 62%);border:1px solid #41718c;border-radius:20px;padding:23px;margin-bottom:16px;overflow:hidden}
.arcade-hero h2{font-size:clamp(2rem,5vw,3.4rem);margin:0}
.arcade-sub{color:#bdd8e9}
.arcade-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:14px}
.arcade-mission{border:1px solid #35627b;border-radius:17px;background:linear-gradient(155deg,#19354b,#0c1b2b);overflow:hidden;transition:.2s transform}
.arcade-mission:hover{transform:translateY(-4px)}
.arcade-mission .photo-wrap{height:145px}
.arcade-mission section{padding:14px}
.arcade-mission strong{font:700 1.6em 'Barlow Condensed',sans-serif}
.arcade-hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:15px 0}
.arcade-hud div{border:1px solid #33536b;background:#102739;border-radius:12px;padding:10px}
.arcade-hud small{color:#a8c3d7;display:block}
.arcade-hud b{font:700 1.6em 'Barlow Condensed',sans-serif}
.arcade-stage{background:radial-gradient(ellipse at 50% 35%,#1f5271,#0b2033 70%);height:210px;border:1px solid #426882;border-radius:15px;position:relative;overflow:hidden;margin:13px 0}
.arcade-stage:before{content:'';position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:32px 32px}
.arcade-runway{position:absolute;left:8%;right:8%;bottom:34%;height:5px;border-top:3px dashed #8ecbe7a8;transform:rotate(-9deg)}
.arcade-jet{position:absolute;top:35%;left:calc(9% + (var(--progress,0) * 0.72%));font-size:3.5rem;filter:drop-shadow(0 12px 9px #0009);transition:left .8s ease,transform .8s ease}
.arcade-jet.working{animation:arcade-float 1.6s ease-in-out infinite alternate}
@keyframes arcade-float{to{transform:translateY(-9px) rotate(5deg)}}
.arcade-node{position:absolute;bottom:13%;font-weight:700;color:#cceafb;font-size:.85em}
.arcade-node.end{right:5%}
.arcade-choices{display:grid;gap:10px}
.arcade-choice{display:block;width:100%;text-align:left;padding:14px;border:1px solid #42627c;border-radius:12px;background:#152c42}
.arcade-choice strong{display:block;font-size:1.08em}
.arcade-choice span{color:#b9cfdd;font-size:.9em}
.arcade-choice:hover{background:#21445b}
.arcade-choice:disabled{opacity:.72;cursor:default}
.arcade-feedback{padding:14px;border:1px solid #537b8d;background:#15354c;border-radius:12px;margin:12px 0}
.arcade-result{border:1px solid #53819a;border-radius:17px;padding:20px;background:linear-gradient(135deg,#153850,#0c1b2d)}
.arcade-meter{height:10px;background:#293a4b;border-radius:12px;overflow:hidden}.arcade-meter span{display:block;height:100%;background:linear-gradient(90deg,#47d0e5,#9edaa4);transition:width .5s ease}
.arcade-explainer{display:grid;grid-template-columns:120px 1fr;gap:13px;align-items:center;margin:10px 0}
.arcade-explainer .photo-wrap{height:90px;border-radius:10px}
.arcade-xp{font-weight:700;color:#f4dc80}
@media(max-width:640px){.arcade-hud{grid-template-columns:repeat(2,1fr)}.arcade-explainer{grid-template-columns:1fr}.arcade-hero{padding:15px}}
@media(prefers-reduced-motion:reduce){.arcade-jet{animation:none!important;transition:none!important}.arcade-mission{transition:none}}


/* Quantified impact simulator */
.impact-hero{background:linear-gradient(115deg,#19364b,#0e1728);border:1px solid #35657f;border-radius:18px;padding:20px;margin-bottom:15px}
.impact-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:9px;margin:14px 0}
.impact-kpis>div{background:#13293d;border:1px solid #355b72;border-radius:12px;padding:12px}
.impact-kpis small{display:block;color:#b5cbde}.impact-kpis b{font:700 1.6rem 'Barlow Condensed',sans-serif}
.impact-fleet{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.impact-aircraft{background:#132739;border:1px solid #345a73;border-radius:13px;overflow:hidden}
.impact-aircraft .photo-wrap{height:130px}
.impact-aircraft section{padding:12px}
.impact-field{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:9px 0}
.impact-field select,.impact-field input{max-width:120px}
.impact-guide{padding:12px;border:1px solid #2f6078;background:#102b41;border-radius:12px;margin:12px 0}
.impact-track{height:110px;position:relative;background:linear-gradient(135deg,#102a3f,#173e55);overflow:hidden;border-radius:13px;border:1px solid #3c6782;margin:13px 0}
.impact-track:before{content:"";position:absolute;top:50%;left:10%;right:10%;border-top:3px dashed #9ed4ec9e}
.impact-flights{position:absolute;left:8%;top:23%;font-size:3rem;animation:impact-fly 2s ease-in-out infinite alternate;filter:drop-shadow(0 7px 4px #0009)}
@keyframes impact-fly{to{left:79%;transform:translateY(-9px)}}
.impact-meter{height:12px;background:#1d3a4b;border-radius:10px;overflow:hidden}.impact-meter>i{display:block;height:100%;background:linear-gradient(90deg,#4ccce3,#86dca8)}
.impact-note{font-size:.89em;color:#b7cada}
.impact-log{max-height:225px;overflow:auto;list-style:none;padding:0}.impact-log li{border-left:3px solid #4381a1;padding:7px 10px;margin:6px 0;background:#152b3b}
@media(prefers-reduced-motion:reduce){.impact-flights{animation:none}}

G.ac.forEach(a=>{if(a.st!="out")return;if(G.storm){L(a.n+" is holding for weather.");return}

{q:"The team returns with an injured survivor. What should already be arranged?",opts:[["Medical reception, treatment and personnel accountability",35,0,"Correct: recovery includes safe return and necessary medical care."],["Only a mission success animation",0,1,"An animation does not substitute for completed medical and accountability tasks."],["Another aircraft without a defined role",5,1,"Unassigned assets do not necessarily help the objective."]]}
]}];
const ACD={mission:null,i:0,score:0,mistakes:0,selected:null,feedback:null,log:[],finished:false};
let careerXP=0;try{careerXP=Number(localStorage.getItem("academy_arcade_xp")||0)}catch(e){}
const arcadePct=()=>Math.round(ACD.i/3*100);
const arcadeMission=()=>ARCADE.find(m=>m.id===ACD.mission);
function arcadeStart(id){const m=ARCADE.find(x=>x.id===id);if(!m)return;Object.assign(ACD,{mission:id,i:0,score:0,mistakes:0,selected:null,feedback:null,log:[],finished:false});showToast('🎮 Mission started: '+m.title);draw()}
function arcadeChoose(k){const m=arcadeMission(),step=m?.stages[ACD.i];if(!step||ACD.selected!==null)return;const o=step.opts[k];if(!o)return;ACD.selected=k;ACD.score+=o[1];ACD.mistakes+=o[2];ACD.feedback=o[3];ACD.log.push({q:step.q,choice:o[0],explanation:o[3],good:o[2]===0});if(o[2]===0)showToast('⭐ Great decision! +'+o[1]+' points');else showToast('📘 Learning moment: review the explanation');draw()}
function arcadeNext(){const m=arcadeMission();if(!m||ACD.selected===null)return;ACD.i++;ACD.selected=null;ACD.feedback=null;if(ACD.i>=m.stages.length){ACD.finished=true;const reward=ACD.score>=70?Math.max(10,ACD.score):15;careerXP+=reward;try{localStorage.setItem("academy_arcade_xp",String(careerXP))}catch(e){}showToast('🏆 Debrief unlocked · +'+reward+' XP')}draw()}
function arcadeView(){const m=arcadeMission();if(!m)return '<section class="arcade-hero"><span class="ac-role">🎮 MISSION ARCADE • AIR & SPACE ACADEMY</span><h2>Every choice changes the mission.</h2><p class="arcade-sub">Choose a scenario, study the aircraft, react to realistic classroom problems and earn XP. No meaningless arrows; each choice changes your mission grade and debrief.</p><div class="arcade-xp">⭐ '+careerXP+' career XP earned</div></section><div class="arcade-grid">'+ARCADE.map(x=>'<article class="arcade-mission">'+photo(x.asset)+'<section><span class="ac-role">'+esc(x.tag)+'</span><br><strong>'+esc(x.title)+'</strong><p>'+esc(x.brief)+'</p><div class="row"><button class="on" data-arcade-start="'+x.id+'">▶ Start mission</button><button data-arcade-learn="'+x.asset+'">✈ Aircraft card</button></div></section></article>').join('')+'</div>';
const a=byId[m.asset];
const hud='<div class="arcade-hud"><div><small>PHASE</small><b>'+Math.min(ACD.i+1,3)+'/3</b></div><div><small>SCORE</small><b>'+ACD.score+'/100</b></div><div><small>DECISIONS TO REVIEW</small><b>'+ACD.mistakes+'</b></div><div><small>CAREER XP</small><b>'+careerXP+'</b></div></div>';
const stage='<div class="arcade-stage"><div class="arcade-runway"></div><div class="arcade-jet '+(!ACD.finished?'working':'')+'" style="left:'+(9+Math.min(100,arcadePct()+(ACD.selected!==null?25:0))*.72)+'%">✈️</div><div class="arcade-node" style="left:5%">🏠 BASE</div><div class="arcade-node end">🎯 OBJECTIVE</div></div>';
if(ACD.finished){const label=ACD.score>=85?'🏆 MISSION ACCOMPLISHED':ACD.score>=55?'🟡 PARTIAL SUCCESS':'📘 TRAINING MISSION INCOMPLETE';return '<section class="arcade-hero"><span class="ac-role">AFTER ACTION REVIEW</span><h2>'+esc(m.title)+'</h2><p>'+esc(m.brief)+'</p></section>'+hud+stage+'<section class="arcade-result"><h2>'+label+' · '+ACD.score+'%</h2><p>'+ (ACD.score>=85?'Excellent: the key capabilities and support were correctly matched.':"Review the missed decisions, then replay to improve.")+'</p><h3>Decision-by-decision debrief</h3>'+ACD.log.map((x,i)=>'<div class="arcade-feedback"><b>'+(i+1)+'. '+esc(x.q)+'</b><p class="'+(x.good?'ok':'bad')+'">Your decision: '+esc(x.choice)+'</p><p>'+esc(x.explanation)+'</p></div>').join('')+'<div class="row"><button class="on" data-arcade-start="'+m.id+'">↻ Replay mission</button><button data-arcade-menu="1">🎮 More missions</button></div></section>'}
const item=m.stages[ACD.i];return '<section class="arcade-hero"><span class="ac-role">LIVE TRAINING • '+esc(m.tag)+'</span><h2>'+esc(m.title)+'</h2><p class="arcade-sub">'+esc(m.brief)+'</p><button data-arcade-menu="1">← All missions</button></section>'+hud+stage+'<section class="card"><div class="arcade-explainer">'+photo(m.asset)+'<div><span class="ac-role">FEATURED AIRCRAFT</span><h3>'+esc(a.name)+'</h3><div class="pro-con"><div class="positive"><b class="ok">✓ Pro</b><br>'+esc(a.pro)+'</div><div class="negative"><b class="bad">⚠ Con</b><br>'+esc(a.con)+'</div></div><button data-arcade-learn="'+a.id+'">🔎 Full aircraft briefing</button></div></div><div class="arcade-meter"><span style="width:'+arcadePct()+'%"></span></div><h2>Decision '+(ACD.i+1)+': '+esc(item.q)+'</h2><div class="arcade-choices">'+item.opts.map((o,k)=>'<button class="arcade-choice" data-arcade-choice="'+k+'" '+(ACD.selected!==null?'disabled':'')+'><strong>'+String.fromCharCode(65+k)+'. '+esc(o[0])+'</strong><span>'+ (ACD.selected===k?'✓ Your selection':'Choose this option')+'</span></button>').join('')+'</div>'+(ACD.feedback!==null?'<div class="arcade-feedback" role="status"><h3>'+(ACD.mistakes&&item.opts[ACD.selected][2]?'📘 Learn from this':'⭐ Well planned!')+'</h3><p>'+esc(ACD.feedback)+'</p><button class="on" data-arcade-next="1">'+(ACD.i===2?'🏁 Finish and debrief':'Next decision →')+'</button></div>':'<p class="mut">Choose one answer to receive feedback. Your choices affect the final score.</p>')+'</section>'}
V.arcade=arcadeView;TABS.unshift(["arcade","🎮 Mission Arcade"]);
document.addEventListener("click",e=>{const b=e.target.closest("[data-arcade-start],[data-arcade-menu],[data-arcade-choice],[data-arcade-next],[data-arcade-learn]");if(!b)return;if(b.hasAttribute("data-arcade-start")){S.view="arcade";arcadeStart(b.dataset.arcadeStart)}else if(b.hasAttribute("data-arcade-menu")){ACD.mission=null;S.view="arcade";draw()}else if(b.hasAttribute("data-arcade-choice"))arcadeChoose(+b.dataset.arcadeChoice);else if(b.hasAttribute("data-arcade-next"))arcadeNext();else if(b.hasAttribute("data-arcade-learn"))modalAsset(b.dataset.arcadeLearn)});


/* ---------- IMPACT LAB: transparent fictional logistics planning model ---------- */
/* Public max payloads are reference facts, not automatic mission loads.
   Game sortie loads, airport limitations, team handling, casualty capacities and
   relief consumption rates are explicitly fictional classroom assumptions. */
const IMPACT_TYPES={
c5:{short:"C-5M",max:281001,training:180000,cost:7,patients:0,role:"Heavy supplies",airports:["major"]},
c17:{short:"C-17",max:170900,training:100000,cost:5,patients:8,role:"Supplies or medical evacuation",airports:["major","regional"]},
c130:{short:"C-130J-30",max:44000,training:30000,cost:2,patients:3,role:"Flexible supplies or medical evacuation",airports:["major","regional","austere"]}
};
const IMPACT_AIRPORTS={major:"Major airport (all aircraft)",regional:"Regional airport (C-17 / C-130)",austere:"Austere airstrip (C-130 only)"};
const IP={phase:"setup",day:1,days:5,stock:700000,patients:26,needed:500000,needsPatients:20,quality:90,teams:3,budget:80,used:0,rawDelivered:0,usable:0,patientsMoved:0,attempted:0,blocked:0,log:[],airport:"regional",fleet:{c5:0,c17:2,c130:2},med:{c5:0,c17:1,c130:1},last:[],history:[]};
const fmtImpact=n=>Math.round(n).toLocaleString("en-US");
function impactReset(){Object.assign(IP,{phase:"setup",day:1,days:5,stock:700000,patients:26,needed:500000,needsPatients:20,quality:90,teams:3,budget:80,used:0,rawDelivered:0,usable:0,patientsMoved:0,attempted:0,blocked:0,log:[],airport:"regional",fleet:{c5:0,c17:2,c130:2},med:{c5:0,c17:1,c130:1},last:[],history:[]});draw()}
function impactValidation(){
 const err=[];
 for(const k of Object.keys(IMPACT_TYPES)){if(IP.fleet[k]+IP.med[k]>5)err.push(IMPACT_TYPES[k].short+" exceeds five training aircraft.");if(IP.med[k]&&!IMPACT_TYPES[k].patients)err.push(IMPACT_TYPES[k].short+" is cargo-only in this particular scenario.")}
 if(!Object.values(IP.fleet).some(Boolean)&&!Object.values(IP.med).some(Boolean))err.push("Choose at least one available aircraft.");
 return err;
}
function impactDay(){
 if(IP.phase==="finished")return;
 const err=impactValidation();if(err.length){showToast("⚠ "+err[0]);return}
 const day=IP.day;
 /* scripted, disclosed exercise conditions, not weather prediction */
 const weather=day===2?.75:day===4?.5:1;
 const heavyClosed=day===4;
 const teamCapacity=IP.teams*60000;
 let offloadLeft=teamCapacity, cargo=0, usable=0, evacuated=0, spent=0, flew=0, denied=0;
 let lines=[];
 for(const k of ["c5","c17","c130"]){
  const t=IMPACT_TYPES[k];
  for(let n=0;n<IP.fleet[k];n++){
    if(!t.airports.includes(IP.airport)||heavyClosed&&k!=="c130"){denied++;lines.push(t.short+" cargo flight held: runway limitation.");continue}
    if(IP.used+spent+t.cost>IP.budget){denied++;lines.push(t.short+" cargo flight held: insufficient simulation budget.");continue}
    if(IP.stock<=0){lines.push(t.short+" not dispatched: no cargo inventory remains.");continue}
    const planned=Math.floor(t.training*weather);
    const loaded=Math.min(IP.stock,planned);
    if(loaded>offloadLeft){denied++;lines.push(t.short+" cargo flight held: receiving crews cannot unload this load today.");continue}
    IP.stock-=loaded;offloadLeft-=loaded;cargo+=loaded;usable+=Math.round(loaded*IP.quality/100);
    spent+=t.cost;flew++;lines.push(t.short+" delivered "+fmtImpact(loaded)+" lb; "+fmtImpact(Math.round(loaded*IP.quality/100))+" lb usable.");
  }
 }
 for(const k of ["c17","c130"]){
  const t=IMPACT_TYPES[k];
  for(let n=0;n<IP.med[k];n++){
   if(!t.airports.includes(IP.airport)||heavyClosed&&k!=="c130"){denied++;lines.push(t.short+" medical flight held: runway limitation.");continue}
   if(IP.used+spent+t.cost>IP.budget){denied++;lines.push(t.short+" medical flight held: insufficient simulation budget.");continue}
   const moved=Math.min(IP.patients,t.patients,Math.max(1,Math.floor(t.patients*weather)));
   if(!IP.patients){lines.push(t.short+" medical flight not needed: no patients waiting.");continue}
   IP.patients-=moved;evacuated+=moved;spent+=t.cost;flew++;
   lines.push(t.short+" evacuated "+moved+" patient"+(moved===1?"":"s")+".");
  }
 }
 IP.rawDelivered+=cargo;IP.usable+=usable;IP.patientsMoved+=evacuated;
 IP.used+=spent;IP.attempted+=flew;IP.blocked+=denied;
 IP.last=lines;IP.history.push({day,cargo,usable,evacuated,spent,flew,denied});
 IP.log.unshift(...lines.map(line=>"Day "+day+": "+line));
 if(day===2)IP.log.unshift("Day 2: weather reduces planned loads and medical movement to 75% in this fictional model.");
 if(day===4)IP.log.unshift("Day 4: runway restrictions close the destination to heavy-aircraft arrivals.");
 if(day>=IP.days){IP.phase="finished";showToast("🏁 Mission debrief ready")}else{IP.day++;IP.phase="running";showToast("✈ Day "+day+" complete: "+fmtImpact(usable)+" usable lb delivered")}
 draw();
}
function impactConfig(k,v){
 const n=Number(v);
 if(k==="airport"){IP.airport=v}else if(k==="quality")IP.quality=Math.max(50,Math.min(100,n));
 else if(k==="teams")IP.teams=Math.max(1,Math.min(6,n));
 else if(k==="budget")IP.budget=Math.max(20,Math.min(160,n));
 else if(k.startsWith("cargo:")){const id=k.slice(6);if(IMPACT_TYPES[id])IP.fleet[id]=Math.max(0,Math.min(5,n))}
 else if(k.startsWith("med:")){const id=k.slice(4);if(IMPACT_TYPES[id])IP.med[id]=Math.max(0,Math.min(5,n))}
 IP.phase="setup";draw();
}
function impactView(){
 const pct=Math.min(100,Math.round(IP.usable/IP.needed*100));
 const medPct=Math.min(100,Math.round(IP.patientsMoved/IP.needsPatients*100));
 const result=IP.usable>=IP.needed&&IP.patientsMoved>=IP.needsPatients;
 const kpi='<div class="impact-kpis"><div><small>Day</small><b>'+Math.min(IP.day,IP.days)+' / '+IP.days+'</b></div><div><small>Usable supplies</small><b>'+fmtImpact(IP.usable)+' lb</b></div><div><small>Evacuated</small><b>'+IP.patientsMoved+' / '+IP.needsPatients+'</b></div><div><small>Budget left</small><b>'+fmtImpact(IP.budget-IP.used)+'</b></div></div>';
 let h='<div class="impact-hero"><span class="ac-role">📊 QUANTITY • QUALITY • IMPACT</span><h2>Operations Reality Lab</h2><p>Plan a five-day fictional humanitarian airlift. Aircraft quantities, usable supply quality, runway access, receiving crews, medical capacity and resources all change the actual simulation outcome.</p><button data-impact-reset="1">↻ Reset mission</button></div>'+kpi;
 h+='<div class="card"><h3>Measured mission objective</h3><p>Deliver <b>'+fmtImpact(IP.needed)+' lb of usable supplies</b> and evacuate <b>'+IP.needsPatients+' patients</b> within five simulated days.</p><p>Supplies: '+pct+'% ('+fmtImpact(IP.usable)+' usable of '+fmtImpact(IP.rawDelivered)+' physically delivered lb)</p><div class="impact-meter"><i style="width:'+pct+'%"></i></div><p>Medical evacuation: '+medPct+'%</p><div class="impact-meter"><i style="width:'+medPct+'%"></i></div><div class="impact-guide"><b>Real figures versus scenario assumptions:</b> Published aircraft maximum payloads are reference specifications. The per-sortie loads shown below, readiness, availability, patient seats, costs, weather, airport classes and unload rates are explicitly <b>fictional classroom assumptions</b>—not operational performance figures. "Impact" means measured progress on these fictional objectives, not predicted real-world casualties or effects.</div></div>';
 if(IP.phase==="finished"){
  h+='<div class="arcade-result"><h2>'+(result?"🏆 MISSION ACCOMPLISHED":"📋 MISSION INCOMPLETE")+'</h2><p>Usable cargo: <b>'+fmtImpact(IP.usable)+' lb</b> out of '+fmtImpact(IP.needed)+' lb goal. Patients safely moved: <b>'+IP.patientsMoved+'</b> out of '+IP.needsPatients+'.</p><p>Actual delivered weight: '+fmtImpact(IP.rawDelivered)+' lb. Quality reduced effective delivery by '+fmtImpact(IP.rawDelivered-IP.usable)+' lb. Dispatches completed: '+IP.attempted+'. Flights held: '+IP.blocked+'. Budget used: '+IP.used+'/'+IP.budget+' exercise points.</p><h3>Daily impact record</h3><table><tr><th>Day</th><th>Delivered lb</th><th>Usable lb</th><th>Patients</th><th>Points used</th></tr>'+IP.history.map(x=>'<tr><td>'+x.day+'</td><td>'+fmtImpact(x.cargo)+'</td><td>'+fmtImpact(x.usable)+'</td><td>'+x.evacuated+'</td><td>'+x.spent+'</td></tr>').join('')+'</table><p class="impact-note">Try a different mix of aircraft, more receiving teams, or higher-quality supplies and compare the outcomes.</p><button class="on" data-impact-reset="1">↻ Rebuild and replay</button></div>'
 }else{
  h+='<h3>Set your force package and support</h3><div class="two"><div class="card"><label class="impact-field">Destination airfield<select data-impact-change="airport">'+Object.entries(IMPACT_AIRPORTS).map(([k,v])=>'<option value="'+k+'" '+(IP.airport===k?'selected':'')+'>'+v+'</option>').join('')+'</select></label><label class="impact-field">Usable supply quality<select data-impact-change="quality">'+[50,65,75,85,90,95,100].map(x=>'<option value="'+x+'" '+(IP.quality===x?'selected':'')+'>'+x+'%</option>').join('')+'</select></label><label class="impact-field">Receiving cargo crews<select data-impact-change="teams">'+[1,2,3,4,5,6].map(x=>'<option value="'+x+'" '+(IP.teams===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label class="impact-field">Available exercise budget<select data-impact-change="budget">'+[40,60,80,100,120,160].map(x=>'<option value="'+x+'" '+(IP.budget===x?'selected':'')+'>'+x+' points</option>').join('')+'</select></label></div><div class="card"><h3>Planning assumptions</h3><p class="impact-note">Each selected aircraft makes at most one flight per day. Each crew can unload 60,000 lb/day. The model has 700,000 lb stock and 26 patients awaiting evacuation.</p><p class="impact-note">Day 2: reduced aircraft capacity due to weather. Day 4: heavy-aircraft runway restriction. Flight budgets and medical seats are game values, not real performance data.</p><p class="impact-note">A failed runway or budget validation holds a flight before any cargo moves or points are deducted.</p></div></div>';
  h+='<div class="impact-fleet">'+Object.entries(IMPACT_TYPES).map(([k,t])=>'<div class="impact-aircraft">'+photo(k)+'<section><h3>'+t.short+'</h3><p>'+esc(t.role)+'</p><p><b>Published max payload:</b> '+fmtImpact(t.max)+' lb<br><b>Scenario planning load:</b> '+fmtImpact(t.training)+' lb/flight<br><b>Fictional budget:</b> '+t.cost+' points/flight</p><label class="impact-field">Cargo aircraft<select data-impact-change="cargo:'+k+'">'+[0,1,2,3,4,5].map(n=>'<option value="'+n+'" '+(IP.fleet[k]===n?'selected':'')+'>'+n+'</option>').join('')+'</select></label>'+ (t.patients?'<label class="impact-field">Medical aircraft<select data-impact-change="med:'+k+'">'+[0,1,2,3,4,5].map(n=>'<option value="'+n+'" '+(IP.med[k]===n?'selected':'')+'>'+n+'</option>').join('')+'</select></label><p class="impact-note">Scenario medical capacity: '+t.patients+' patients/flight</p>':'<p class="impact-note">Not a medical role in this scenario.</p>')+'</section></div>').join('')+'</div>';
  const errs=impactValidation();if(errs.length)h+='<div class="ev" role="alert">'+errs.map(esc).join('<br>')+'</div>';
  h+='<div class="impact-track"><span style="position:absolute;left:5%;bottom:8%;color:#c4e7fb">BASE</span><span class="impact-flights">✈️</span><span style="position:absolute;right:4%;bottom:8%;color:#c4e7fb">RELIEF SITE</span></div><div class="row"><button class="on" data-impact-day="1" '+(errs.length?'disabled':'')+'>▶ Execute day '+IP.day+' and calculate impact</button><button data-impact-reset="1">Reset</button></div>';
 }
 if(IP.history.length){h+='<section class="card"><h3>Mission operations log</h3><ul class="impact-log">'+IP.log.slice(0,30).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></section>'}
 return h;
}
V.impact=impactView;TABS.splice(1,0,["impact","📊 Impact Lab"]);
document.addEventListener("change",e=>{const c=e.target.closest("[data-impact-change]");if(c)impactConfig(c.dataset.impactChange,c.value)});
document.addEventListener("click",e=>{if(e.target.closest("[data-impact-reset]"))impactReset();else if(e.target.closest("[data-impact-day]"))impactDay()});

S.view='impact';

draw();
